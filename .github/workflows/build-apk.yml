name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PotyGram Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Generate Native Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.potygram --project-name potygram
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
          """
          content = content.replace("<application", perms + "\n    <application", 1)
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          
          for fname in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              try:
                  with open(fname, "r") as f:
                      c = f.read()
                  c = c.replace("flutter.minSdkVersion", "24")
                  with open(fname, "w") as f:
                      f.write(c)
              except Exception:
                  pass
          '
          echo "=== Manifest Preview ==="
          head -n 25 android/app/src/main/AndroidManifest.xml

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK for Upload
        run: |
          mkdir -p dist
          echo "=== Searching for generated APKs ==="
          find . -name "*.apk" -ls
          find . -name "*.apk" -exec cp -v {} dist/ \;
          echo "=== Dist folder contents ==="
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: potygram-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
