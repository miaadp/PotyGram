name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build PotyGram Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Generate Native Android Platform Files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.potygram --project-name potygram
          python3 tool/configure_android.py
          echo "=== Manifest Preview ==="
          head -n 25 android/app/src/main/AndroidManifest.xml

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Release APK
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build.log || {
            echo "==================== BUILD ERROR TAIL ===================="
            tail -n 250 build.log
            exit 1
          }

      - name: Prepare APK for Upload
        run: |
          mkdir -p dist
          echo "=== Searching for generated APKs ==="
          find . -name "*.apk" -ls
          find . -name "*.apk" -exec cp -v {} dist/ \;
          echo "=== Dist folder contents ==="
          ls -lh dist/

      - name: Save Build Failure to Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          tail -n 300 build.log > build-error.txt
          git add build-error.txt
          git commit -m "build failure log"
          git push -f origin debug-log || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: potygram-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 dist/*.apk --title "PotyGram Android v1.0.0" --notes "Release build of PotyGram Android APK (End-to-End Encrypted Messenger)" --clobber || true
