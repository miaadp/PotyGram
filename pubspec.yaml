name: potygram
description: "PotyGram - End-to-end encrypted messaging client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cryptography
  sodium: ^3.4.0
  sodium_libs: ^3.4.0
  convert: ^3.1.1
  crypto: ^3.0.3

  # Networking & HTTP
  dio: ^5.4.3+1
  http_parser: ^4.0.2

  # Secure Storage & Database
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # State Management
  provider: ^6.1.2

  # Media & UI Utilities
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
